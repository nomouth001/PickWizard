# Docker Compose 설정 (최신 버전은 version 불필요)

services:
  # === PostgreSQL 데이터베이스 ===
  postgres:
    image: postgres:15-alpine
    container_name: lotto645_postgres
    environment:
      POSTGRES_USER: lotto_user
      POSTGRES_PASSWORD: lotto_pass
      POSTGRES_DB: lotto645_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotto_user -d lotto645_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lotto_network

  # === Redis 캐시 ===
  redis:
    image: redis:7-alpine
    container_name: lotto645_redis
    command: redis-server --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lotto_network

  # === pgAdmin (DB 관리 도구, 선택) ===
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lotto645_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@luckyai645.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - lotto_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lotto_network:
    driver: bridge

