[pytest]
# pytest 설정 파일
# 2026-01-08 06:35:00 EST - 초기 생성

# 테스트 검색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 출력 옵션
addopts = 
    -v
    --strict-markers
    --tb=short

# 마커 등록
markers =
    unit: 단위 테스트 (빠름)
    integration: 통합 테스트 (느림)
    slow: 느린 테스트 (LSTM 학습 등)

